services:
  imageflasher:
    build: .
    ports:
      - "${WEB_PORT:-8000}:8000"
      - "${WEBSOCKET_PORT:-5010}:5010"
    environment:
      NODE_ENV: production
      WEB_PORT: 8000
      WEBSOCKET_PORT: 5010
      CRAWLER_CONTROL_PORT: 5011
      CRAWLER_IMAGE_HOST: 0.0.0.0
      CRAWLER_CONTROL_HOST: 127.0.0.1
      CRAWLER_EXPLORATION: ${CRAWLER_EXPLORATION:-0.55}
      CRAWLER_CONTENT_POLICY: ${CRAWLER_CONTENT_POLICY:-broad}
      CRAWLER_PAGE_DELAY: ${CRAWLER_PAGE_DELAY:-1.0}
      CRAWLER_GLOBAL_CONCURRENCY: ${CRAWLER_GLOBAL_CONCURRENCY:-16}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - imageflasher
    restart: unless-stopped
