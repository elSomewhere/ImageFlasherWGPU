version: '3.8'

services:
  # Main application server
  imageflasher:
    build: .
    ports:
      - "8000:8000"
      - "5010:5010"
    environment:
      - NODE_ENV=production
      - REDDIT_SUBREDDIT=${REDDIT_SUBREDDIT:-worldnews}
      - WEB_PORT=8000
      - WEBSOCKET_PORT=5010
    volumes:
      # Mount for persistent storage if needed
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis

  # Redis for image caching and queue management
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - imageflasher
    restart: unless-stopped

  # Optional: Monitoring with Prometheus (for production monitoring)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles:
      - monitoring

volumes:
  redis_data:

# For development override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
networks:
  default:
    name: imageflasher-network