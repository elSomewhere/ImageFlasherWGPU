events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream imageflasher_web {
        server imageflasher:8000;
    }

    upstream imageflasher_artifacts {
        server imageflasher:5010;
    }

    server {
        listen 80;
        server_name _;

        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            proxy_pass http://imageflasher_web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Use the UI as /?imageWs=ws://HOST/stream (wss:// under TLS).
        location /stream {
            proxy_pass http://imageflasher_artifacts;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location = /health {
            proxy_pass http://imageflasher_web;
            access_log off;
        }
    }
}
